upstream api_gateway {
    server api-gateway:5000;
}

upstream messaging {
    server messaging-service:5005;
}

upstream notifications {
    server notification-service:5006;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name 54.254.253.88;

    client_max_body_size 10M;

    # --- API Gateway (backend REST) ---
    location /api/ {
        proxy_pass http://api_gateway/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Messaging Service (Socket.IO) ---
    location /socket.io/ {
        proxy_pass http://messaging/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # --- Notification Service (REST) ---
    location /notifications/ {
        proxy_pass http://notifications/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend (React SPA) - catch-all ---
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
